services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:?Set a disposable local password in .env}
      MYSQL_DATABASE: hotel_demo
      MYSQL_USER: hotel_demo
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:?Set a disposable local password in .env}
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
